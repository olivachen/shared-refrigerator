<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Refrigerator / Gemeinschaftskühlschrank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen pb-12" x-data="fridgeApp()">

    <!-- Header / Banner -->
    <header class="bg-black text-white p-6 border-b-4 border-emerald-500 sticky top-0 z-10 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black uppercase tracking-tight">Shared Refrigerator</h1>
                <p class="text-xs text-stone-400 font-medium">Galopprennbahn • Mutual Aid Commons</p>
            </div>
            <button @click="lang = (lang === 'en' ? 'de' : 'en')" 
                    class="bg-stone-800 hover:bg-stone-700 text-xs font-bold px-3 py-1.5 rounded-full border border-stone-600 transition">
                <span x-text="lang === 'en' ? 'DE 🇩🇪' : 'EN 🇬🇧'"></span>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Motto Banner -->
        <div class="bg-emerald-100 border-2 border-emerald-600 p-4 rounded-xl text-center">
            <p class="font-extrabold text-emerald-950 text-sm" x-text="lang === 'en' ? 'Take what you need, give what you can.' : 'Nimm, was du brauchst. Gib, was du kannst.'"></p>
            <p class="text-xs text-emerald-800 mt-1" x-text="lang === 'en' ? 'Check dates • Check ingredients • Keep it safe' : 'MHD beachten • Zutaten prüfen • Sicher bleiben'"></p>
        </div>

        <!-- Add Item Form -->
        <section class="bg-white p-4 rounded-xl border-2 border-stone-900 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
            <div class="flex justify-between items-center cursor-pointer" @click="showAddModal = !showAddModal">
                <h2 class="font-black text-base uppercase flex items-center gap-2">
                    <span class="text-xl">+</span> 
                    <span x-text="lang === 'en' ? 'Log Food Item' : 'Essen Eintragen'"></span>
                </h2>
                <span class="text-xl font-bold" x-text="showAddModal ? '−' : '+'"></span>
            </div>

            <form x-show="showAddModal" x-transition @submit.prevent="addItem()" class="mt-4 space-y-3">
                <!-- Name -->
                <div>
                    <label class="block text-xs font-bold uppercase mb-1" x-text="lang === 'en' ? 'Item Name' : 'Bezeichnung'"></label>
                    <input type="text" x-model="newItem.name" required placeholder="e.g. Oat Milk / Hafermilch" 
                           class="w-full p-2.5 border-2 border-stone-900 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                
                <!-- Quantity & Category -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1" x-text="lang === 'en' ? 'Quantity' : 'Menge'"></label>
                        <input type="number" min="1" x-model="newItem.qty" required 
                               class="w-full p-2.5 border-2 border-stone-900 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1" x-text="lang === 'en' ? 'Category' : 'Kategorie'"></label>
                        <select x-model="newItem.category" class="w-full p-2.5 border-2 border-stone-900 rounded-lg text-sm bg-white border-stone-900">
                            <option value="Produce">🥦 Fresh Produce / Obst & Gemüse</option>
                            <option value="Bakery">🍞 Bakery / Backwaren</option>
                            <option value="Packaged">📦 Packaged / Haltbares</option>
                            <option value="Drinks">🧃 Drinks / Getränke</option>
                            <option value="Other">🍽️ Other / Sonstiges</option>
                        </select>
                    </div>
                </div>

                <!-- Best Before Date (MHD) -->
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">
                        <span x-text="lang === 'en' ? 'Best Before Date (MHD)' : 'Mindesthaltbarkeitsdatum (MHD)'"></span>
                        <span class="text-stone-400 font-normal lowercase">(optional)</span>
                    </label>
                    <input type="date" x-model="newItem.expiry" 
                           class="w-full p-2.5 border-2 border-stone-900 rounded-lg text-sm bg-white">
                </div>

                <!-- Ingredients / Allergens / Notes -->
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">
                        <span x-text="lang === 'en' ? 'Ingredients / Allergens / Notes' : 'Zutaten / Allergene / Hinweise'"></span>
                        <span class="text-stone-400 font-normal lowercase">(optional)</span>
                    </label>
                    <input type="text" x-model="newItem.notes" placeholder="e.g. Contains gluten, sealed, unopened" 
                           class="w-full p-2.5 border-2 border-stone-900 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <button type="submit" 
                        class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-black uppercase py-3 rounded-lg border-2 border-stone-900 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-0.5 transition">
                    <span x-text="lang === 'en' ? 'Add to Fridge Inventory' : 'Zum Kühlschrank Hinzufügen'"></span>
                </button>
            </form>
        </section>

        <!-- Live Inventory Section -->
        <section class="space-y-3">
            <div class="flex justify-between items-baseline px-1">
                <h2 class="font-black text-lg uppercase tracking-tight" x-text="lang === 'en' ? 'Current Shelf Items' : 'Aktueller Inhalt'"></h2>
                <span class="text-xs font-bold bg-stone-200 px-2 py-1 rounded-full text-stone-700" x-text="items.length + ' items'"></span>
            </div>

            <!-- Empty State -->
            <template x-if="items.length === 0">
                <div class="bg-white border-2 border-dashed border-stone-400 rounded-xl p-8 text-center space-y-2">
                    <p class="text-3xl">🧊</p>
                    <p class="font-bold text-sm text-stone-600" x-text="lang === 'en' ? 'The fridge is currently empty!' : 'Der Kühlschrank ist derzeit leer!'"></p>
                    <p class="text-xs text-stone-500" x-text="lang === 'en' ? 'Be the first to drop off surplus food.' : 'Sei der/die Erste, der/die Essen vorbeibringt.'"></p>
                </div>
            </template>

            <!-- Item Cards -->
            <div class="space-y-2.5">
                <template x-for="(item, index) in items" :key="index">
                    <div class="bg-white p-4 rounded-xl border-2 border-stone-900 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-black text-base" x-text="item.name"></span>
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-stone-100 border border-stone-300" x-text="item.category"></span>
                                </div>
                                <p class="text-[11px] text-stone-500 mt-0.5">
                                    <span x-text="lang === 'en' ? 'Logged: ' : 'Eingetragen: '"></span>
                                    <span x-text="item.timestamp"></span>
                                </p>
                            </div>
                            <span class="font-black text-lg bg-emerald-100 text-emerald-900 px-3 py-1 rounded-lg border border-emerald-400" x-text="item.qty + 'x'"></span>
                        </div>

                        <!-- Date & Allergen Badges -->
                        <div class="flex flex-wrap gap-2 text-xs pt-1 border-t border-stone-100">
                            <template x-if="item.expiry">
                                <span class="bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 rounded font-semibold flex items-center gap-1">
                                    ⏳ <span x-text="(lang === 'en' ? 'Best before: ' : 'MHD: ') + item.expiry"></span>
                                </span>
                            </template>
                            <template x-if="item.notes">
                                <span class="bg-blue-50 text-blue-900 border border-blue-200 px-2 py-0.5 rounded font-medium flex items-center gap-1">
                                    🏷️ <span x-text="item.notes"></span>
                                </span>
                            </template>
                        </div>

                        <!-- Action Button -->
                        <div class="flex justify-end pt-1">
                            <button @click="takeItem(index)" 
                                    class="bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs uppercase px-4 py-2 rounded-lg border border-stone-900 shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] active:translate-y-0.5 transition">
                                <span x-text="lang === 'en' ? 'Take / Took Item' : 'Entnommen'"></span>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </section>

    </main>

    <script>
        function fridgeApp() {
            return {
                lang: 'en',
                showAddModal: true,
                newItem: { name: '', qty: 1, category: 'Produce', expiry: '', notes: '' },
                items: JSON.parse(localStorage.getItem('fridge_items')) || [
                    { 
                        name: 'Oat Milk (Unopened)', 
                        qty: 2, 
                        category: 'Drinks', 
                        expiry: '2026-09-15', 
                        notes: 'Gluten-free, store chilled', 
                        timestamp: 'Today, 14:20' 
                    },
                    { 
                        name: 'Fresh Apples', 
                        qty: 5, 
                        category: 'Produce', 
                        expiry: '', 
                        notes: 'Washed, local produce', 
                        timestamp: 'Today, 11:05' 
                    }
                ],
                addItem() {
                    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.items.unshift({
                        name: this.newItem.name,
                        qty: parseInt(this.newItem.qty),
                        category: this.newItem.category,
                        expiry: this.newItem.expiry,
                        notes: this.newItem.notes,
                        timestamp: `Today, ${time}`
                    });
                    this.save();
                    this.newItem = { name: '', qty: 1, category: 'Produce', expiry: '', notes: '' };
                },
                takeItem(index) {
                    if (this.items[index].qty > 1) {
                        this.items[index].qty--;
                    } else {
                        this.items.splice(index, 1);
                    }
                    this.save();
                },
                save() {
                    localStorage.setItem('fridge_items', JSON.stringify(this.items));
                }
            }
        }
    </script>
</body>
</html>
