<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Gemeinschaftskühlschrank</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F4F4F0',
                        ink: '#1C1C1C',
                        safety: '#0055FF',
                        safetyhover: '#0044CC',
                        grayborder: '#C0C0BC'
                    },
                    fontFamily: {
                        sans: ['"Inter Tight"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F4F4F0; color: #1C1C1C; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body x-data="fridgeApp()" class="min-h-screen font-sans selection:bg-safety selection:text-white pb-24">

    <header class="sticky top-0 z-50 bg-paper border-b-2 border-ink px-4 py-4">
        <a href="#" @click.prevent="window.scrollTo(0,0)" class="block group w-max">
            <h1 class="text-xl font-bold text-ink underline decoration-safety decoration-4 underline-offset-4 group-hover:text-safety transition-colors">
                Gemeinschaftskühlschrank
            </h1>
            <p class="text-sm font-semibold text-gray-500 mt-1">(Shared Refrigerator)</p>
        </a>
    </header>

    <main class="max-w-lg mx-auto p-4 space-y-10 mt-4">

        <section>
            <h2 class="text-sm font-bold uppercase tracking-wide text-gray-600 mb-4">Register New Item / Neuen Artikel erfassen</h2>
            
            <form @submit.prevent="addItem()" class="space-y-5 border-2 border-ink p-5 bg-white shadow-[4px_4px_0px_0px_#1C1C1C]">
                
                <div class="border-b-2 border-grayborder pb-3">
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-2">Item Name / Bezeichnung</label>
                    <input type="text" x-model="newItem.name" required placeholder="e.g. Hafermilch" 
                           class="w-full text-lg font-semibold focus:outline-none bg-transparent placeholder-gray-400">
                </div>
                
                <div class="grid grid-cols-2 gap-6 border-b-2 border-grayborder pb-3">
                    <div class="border-r-2 border-grayborder pr-6">
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-2">Quantity / Menge</label>
                        <input type="number" min="1" x-model="newItem.qty" required 
                               class="w-full text-lg font-mono focus:outline-none bg-transparent">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-2">Category / Kategorie</label>
                        <select x-model="newItem.category" class="w-full text-base font-semibold focus:outline-none bg-transparent">
                            <option value="Produce">Produce / Obst & Gemüse</option>
                            <option value="Bakery">Bakery / Backwaren</option>
                            <option value="Packaged">Packaged / Haltbares</option>
                            <option value="Drinks">Drinks / Getränke</option>
                            <option value="Other">Other / Sonstiges</option>
                        </select>
                    </div>
                </div>

                <div class="border-b-2 border-grayborder pb-3">
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-2">Best Before / MHD (Optional)</label>
                    <input type="date" x-model="newItem.expiry" 
                           class="w-full text-base font-mono focus:outline-none bg-transparent text-ink">
                </div>

                <div class="pb-2">
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-2">Notes / Notizen (Optional)</label>
                    <input type="text" x-model="newItem.notes" placeholder="e.g. Unopened / Ungeöffnet" 
                           class="w-full text-base font-semibold focus:outline-none bg-transparent placeholder-gray-400">
                </div>

                <button type="submit" 
                        class="w-full bg-safety hover:bg-safetyhover text-white font-bold text-lg py-4 transition-colors shadow-[2px_2px_0px_0px_#1C1C1C] active:translate-y-1 active:shadow-none">
                    Submit Record / Eintrag speichern
                </button>
            </form>
        </section>

        <section>
            <div class="flex justify-between items-baseline mb-4 border-b-2 border-ink pb-2">
                <h2 class="text-sm font-bold uppercase tracking-wide text-gray-600">Current Inventory / Aktueller Bestand</h2>
                <span class="text-xs font-mono font-bold text-safety" x-text="items.length + ' Records / Einträge'"></span>
            </div>

            <div x-show="loading" class="border-2 border-ink p-6 text-center text-base font-mono animate-pulse bg-white">
                Loading database...
            </div>

            <div x-show="!loading && items.length === 0" class="border-2 border-ink border-dashed p-10 text-center text-gray-500 text-base font-semibold bg-white">
                No items currently logged. / Derzeit keine Artikel erfasst.
            </div>

            <div class="space-y-4" x-show="!loading && items.length > 0">
                <template x-for="(item, index) in items" :key="item.id">
                    <div class="p-4 border-2 border-ink bg-white shadow-[4px_4px_0px_0px_#1C1C1C]">
                        <div class="flex justify-between items-start">
                            <div class="pr-4">
                                <h3 class="font-bold text-xl text-ink" x-text="item.name"></h3>
                                <p class="text-xs uppercase font-semibold text-gray-600 mt-1">
                                    <span x-text="item.category"></span>
                                    <template x-if="item.expiry">
                                        <span x-text="' | MHD: ' + item.expiry"></span>
                                    </template>
                                </p>
                                <template x-if="item.notes">
                                    <p class="text-sm font-medium text-gray-700 mt-2 bg-gray-100 p-2 inline-block border border-grayborder" x-text="'* ' + item.notes"></p>
                                </template>
                            </div>
                            
                            <div class="flex flex-col items-end shrink-0">
                                <div class="font-mono text-3xl font-bold text-ink" x-text="item.qty + 'x'"></div>
                                <button @click="takeItem(item.id, item.qty)" 
                                        class="mt-3 text-xs font-bold uppercase text-safety border-2 border-safety px-4 py-2 hover:bg-safety hover:text-white transition-colors">
                                    Take 1 / 1 Entnehmen
                                </button>
                            </div>
                        </div>
                        <div class="text-[10px] font-mono text-gray-400 mt-4 pt-2 border-t border-grayborder flex justify-between">
                            <span x-text="'LOG: ' + String(item.id).substring(0,8)"></span>
                            <span x-text="new Date(item.created_at).toLocaleDateString() + ' ' + new Date(item.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})"></span>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://wdmyownmgtceuwqhichz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkbXlvd25tZ3RjZXV3cWhpY2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MDIzOTksImV4cCI6MjEwNTA3ODM5OX0.cBZCGoO1WVKn-RFurel2TBz6E2UeLNf9G5TrQmWFfVU';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function fridgeApp() {
            return {
                loading: true,
                items: [],
                newItem: { name: '', qty: 1, category: 'Produce', expiry: '', notes: '' },
                
                async init() {
                    await this.fetchItems();
                    supabaseClient.channel('public:fridge_inventory')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'fridge_inventory' }, payload => {
                            this.fetchItems();
                        })
                        .subscribe();
                },

                async fetchItems() {
                    this.loading = true;
                    const { data, error } = await supabaseClient
                        .from('fridge_inventory')
                        .select('*')
                        .order('created_at', { ascending: false });
                    
                    if (!error && data) {
                        this.items = data;
                    } else if (error) {
                        console.error('Fetch error:', error);
                    }
                    this.loading = false;
                },

                async addItem() {
                    if(!this.newItem.name || this.newItem.name.trim() === '') return;
                    
                    const payload = {
                        name: this.newItem.name.trim(),
                        qty: parseInt(this.newItem.qty) || 1,
                        category: this.newItem.category,
                        expiry: this.newItem.expiry || null,
                        notes: this.newItem.notes || null
                    };

                    const { error } = await supabaseClient
                        .from('fridge_inventory')
                        .insert([payload]);

                    if (!error) {
                        this.newItem = { name: '', qty: 1, category: 'Produce', expiry: '', notes: '' };
                        await this.fetchItems();
                    } else {
                        alert("Database error: " + error.message);
                        console.error('Insert error:', error);
                    }
                },

                async takeItem(id, currentQty) {
                    if (currentQty > 1) {
                        await supabaseClient.from('fridge_inventory').update({ qty: currentQty - 1 }).eq('id', id);
                    } else {
                        await supabaseClient.from('fridge_inventory').delete().eq('id', id);
                    }
                    await this.fetchItems();
                }
            }
        }
    </script>
</body>
</html>
